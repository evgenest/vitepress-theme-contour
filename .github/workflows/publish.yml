name: Publish to npm

# Stages the version from package.json if it is not on npm yet.
# A maintainer then approves it with 2FA: `npm stage approve` or the Staged Packages tab on npmjs.com.
on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already published
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --silent 2>/dev/null | grep -qx "$version"; then
            echo "$name@$version is already on npm, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage for approval
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install -g npm@^11.15.0
          npm --version
          npm stage publish
